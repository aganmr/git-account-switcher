[package]
name = "git-account-switcher"
version = "0.2.0"
description = "One-click git account switching for Windows — identity, tokens, gh/glab, and SSH keys all switch together"
edition = "2021"
# The crate builds two binaries (the app + gas-cli); Tauri needs to know
# which one is the app.
default-run = "git-account-switcher"

[lib]
name = "git_account_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gas-cli"
path = "src/bin/gas_cli.rs"

[features]
# this feature is used during production builds to ensure the application
# can be built without `tauri dev` (enables the asset/custom protocol)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
rfd = "0.15"
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
] }
